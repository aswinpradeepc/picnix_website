  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --ink:       #0f0f0f;
      --ink-2:     #333333;
      --muted:     #777777;
      --faint:     #e9e9e9;
      --faintest:  #f4f4f4;
      --bg:        #ffffff;
      --font:      'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono:      'DM Mono', 'SF Mono', 'Fira Code', monospace;
      --max:       620px;
      --ease:      cubic-bezier(0.16, 1, 0.3, 1);
    }

    html { font-size: 16px; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: var(--max);
      width: 100%;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }

    .kicker {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1.15;
      margin-bottom: 1.25rem;
    }

    .message {
      font-size: 1rem;
      color: var(--ink-2);
      max-width: 480px;
      font-weight: 300;
      margin-bottom: 0.75rem;
    }

    .message .highlight {
      color: var(--ink);
      font-weight: 400;
    }

    .aside {
      font-size: 0.85rem;
      color: var(--muted);
      font-style: italic;
      margin-bottom: 2.75rem;
    }

    /* ── BUTTONS ── */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }

    .btn {
      font-size: 0.8rem;
      font-family: var(--mono);
      letter-spacing: 0.02em;
      background: none;
      border: 1px solid var(--ink);
      padding: 0.6rem 1.25rem;
      color: var(--ink);
      text-decoration: none;
      display: inline-block;
      transition: background 0.15s var(--ease), color 0.15s var(--ease);
    }

    .btn:hover {
      background: var(--ink);
      color: var(--bg);
    }

    /* primary CTA */
    .btn-blog {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-weight: 500;
      background: var(--ink);
      color: var(--bg);
    }

    .btn-blog:hover {
      background: var(--bg);
      color: var(--ink);
    }

    .btn-blog .arrow {
      transition: transform 0.15s var(--ease);
    }

    .btn-blog:hover .arrow { transform: translateX(3px); }

    /* ── FOOTER ── */
    #footer {
      border-top: 1px solid var(--faint);
      padding: 1.75rem 1.5rem;
      text-align: center;
    }

    #footer a {
      font-size: 0.8rem;
      font-family: var(--mono);
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    #footer a:hover { color: var(--ink); }

    /* ── FADE-IN ── */
    .fade-up {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.6s var(--ease) forwards;
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up:nth-child(1) { animation-delay: 0.05s; }
    .fade-up:nth-child(2) { animation-delay: 0.12s; }
    .fade-up:nth-child(3) { animation-delay: 0.19s; }
    .fade-up:nth-child(4) { animation-delay: 0.26s; }
    .fade-up:nth-child(5) { animation-delay: 0.33s; }

    /* ── MOBILE: hide the "About Me" button ── */
    @media (max-width: 600px) {
      .btn-about { display: none; }
      h1 { font-size: 1.6rem; }
      main { padding: 3rem 1.25rem; }
      .actions {
        flex-direction: column;
        width: 100%;
        max-width: 280px;
      }
      .btn { width: 100%; text-align: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fade-up { animation: none; opacity: 1; transform: none; }
    }
  </style>
